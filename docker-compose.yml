services:
  # Laravel Backend Service
  backend:
    build:
      context: ./middleware-laravel
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./middleware-laravel:/var/www
    depends_on:
      - mysql-db
    environment:
      - DB_HOST=mysql-db

  # React Frontend Service (Vite)
  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-react:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  # Barcode Backend Service (Node.js)
  barcode-backend:
    build:
      context: ./barcode-backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./barcode-backend:/app
      - /app/node_modules

  # MySQL Database Service
  mysql-db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: Cashiering
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=mysql-db
      - PMA_PORT=3306
    depends_on:
      - mysql-db

  # COBOL Dynamic Core Service
  cobol-service:
    build:
      context: ./cobol-core
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    volumes:
      - ./cobol-core:/app
      - /app/node_modules
    command: sh -c "cobc -x -o total_sales total_sales.cbl && node server.js"

volumes:
  mysql_data: